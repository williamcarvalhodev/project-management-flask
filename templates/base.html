<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A simple and efficient project management system to organize projects, track tasks, and improve team productivity.">

    <title>{% block title %}Project Management{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <!-- Sidebar section -->
    <aside>        
        <nav>
            <img src="{{ url_for('static', filename='images/full-logo-white.png') }}" alt="Logo">

            <a href="{{ url_for('home') }}" class="{% if request.endpoint == 'home' %}active{% endif %}">
                <span>Home</span>
            </a>

            <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
                <i class="bi bi-graph-up"></i>
                <span>Dashboard</span>
            </a>

            <a href="{{ url_for('project_tracker') }}"
                class="{% if request.endpoint == 'project_tracker' %}active{% endif %}">
                <i class="bi bi-folder2"></i>
                <span>Project Tracker</span>
            </a>

            <a href="{{ url_for('in_progress') }}" class="{% if request.endpoint == 'in_progress' %}active{% endif %}">
                <i class="bi bi-list-task"></i>
                <span>In Progress</span>
            </a>

            <a href="{{ url_for('completed_projects') }}"
                class="{% if request.endpoint == 'completed_projects' %}active{% endif %}">
                <i class="bi bi-clipboard-check"></i>
                <span>Completed Projects</span>
            </a>
        </nav>
    </aside>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>

</html>
